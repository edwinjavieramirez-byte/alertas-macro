name: Alertas macro

on:
  # Disparo principal: cron-job.org llama a GitHub cada 5 minutos (puntual).
  workflow_dispatch:
  # Respaldo por si cron-job.org falla (GitHub puede retrasar estos disparos).
  schedule:
    - cron: "*/10 5-21 * * 1-5"

# Nunca dos ejecuciones a la vez (evita alertas duplicadas).
concurrency:
  group: alertas
  cancel-in-progress: false

permissions:
  contents: write   # para guardar estado.json (qué alertas ya se enviaron)

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar calendario y enviar alertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          IMPACTOS: ${{ vars.IMPACTOS }}
          HORA_RESUMEN: ${{ vars.HORA_RESUMEN }}
        run: python alertas.py

      - name: Guardar estado
        run: |
          git config user.name "alertas-bot"
          git config user.email "alertas-bot@users.noreply.github.com"
          git add estado.json calendario_cache.json
          git diff --cached --quiet || (git commit -m "estado" -q && git pull --rebase -q && git push -q)
